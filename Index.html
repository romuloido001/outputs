<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#64708a;--line:#dfe3ee;--brand:#2f5bea;--ok:#12805c;--err:#c0352b}
  @media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b2030;--ink:#eceff7;--mute:#9aa5bf;--line:#2c3348;--brand:#6b8cff;--ok:#4cc79a;--err:#ff7b70}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.6rem;margin:0 0 4px}
  .sub{color:var(--mute);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .drop{margin-top:14px;border:2px dashed var(--line);border-radius:14px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--mute)}
  .drop.over{border-color:var(--brand);color:var(--ink)}
  .drop strong{color:var(--brand)}
  select,input[type=date]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  .grid{display:grid;grid-template-columns:110px 1fr;gap:12px;margin-top:12px}
  .dtrow{display:flex;gap:8px}
  button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--brand);color:#fff}
  ul{list-style:none;padding:0;margin:14px 0 0}
  li{padding:8px 0;border-top:1px solid var(--line);font-size:.95rem;display:flex;gap:8px;justify-content:space-between}
  li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ok{color:var(--ok)}.err{color:var(--err)}.wait{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>📥 Output Drop-off</h1>
  <p class="sub">Upload your computer output: PDF, Word, or picture files (max 20 MB each).</p>
  <div class="card">
    <label for="nm">Your full name</label>
    <input id="nm" type="text" placeholder="e.g. Maria Santos" autocomplete="name">
    <div class="grid">
      <div><label for="gr">Grade</label>
        <select id="gr"><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
      <div><label for="sec">Section</label>
        <input id="sec" type="text" placeholder="e.g. Rizal" autocomplete="off"></div>
    </div>
    <label for="dt" style="margin-top:12px">Date of upload</label>
    <div class="dtrow"><input id="dt" type="date"><button type="button" id="today">Today</button></div>
    <div id="drop" class="drop" tabindex="0">
      <div><strong>Click to choose files</strong> or drag them here</div>
      <div style="font-size:.85rem;margin-top:4px">PDF · Word · JPG · PNG · GIF · WEBP</div>
    </div>
    <input id="pick" type="file" multiple hidden
      accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.webp">
    <ul id="list"></ul>
  </div>
</main>
<script>
  var ALLOWED=['pdf','doc','docx','jpg','jpeg','png','gif','webp'];
  var MAX=20*1024*1024;
  var drop=document.getElementById('drop'),pick=document.getElementById('pick'),
      nm=document.getElementById('nm'),list=document.getElementById('list');

  var gr=document.getElementById('gr'),sec=document.getElementById('sec'),dt=document.getElementById('dt');
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  dt.value=today();
  document.getElementById('today').onclick=function(){dt.value=today()};
  drop.onclick=function(){pick.click()};
  drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick.click()}};
  pick.onchange=function(){handle(Array.from(pick.files));pick.value=''};
  drop.ondragover=function(e){e.preventDefault();drop.classList.add('over')};
  drop.ondragleave=function(){drop.classList.remove('over')};
  drop.ondrop=function(e){e.preventDefault();drop.classList.remove('over');handle(Array.from(e.dataTransfer.files))};

  function addRow(name){
    var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');
    a.textContent=name;b.textContent='Waiting…';b.className='wait';
    li.appendChild(a);li.appendChild(b);list.insertBefore(li,list.firstChild);
    return function(t,c){b.textContent=t;b.className=c};
  }
  function toBase64(file){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){res(String(r.result).split(',')[1])};
      r.onerror=function(){rej(new Error('Could not read file'))};
      r.readAsDataURL(file);
    });
  }
  function send(name,file,b64){
    var g=gr.value,s=sec.value.trim(),d=dt.value;
    return new Promise(function(res,rej){
      google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(new Error(e.message||'Upload failed'))})
        .uploadFile(name,g,s,d,file.name,file.type,b64);
    });
  }
  async function handle(files){
    var name=nm.value.trim();
    if(!name){alert('Please type your name first.');nm.focus();return}
    if(!sec.value.trim()){alert('Please type your section.');sec.focus();return}
    if(!dt.value){alert('Please choose the date of upload.');dt.focus();return}
    for(var i=0;i<files.length;i++){
      var f=files[i],set=addRow(f.name),ext=(f.name.split('.').pop()||'').toLowerCase();
      if(ALLOWED.indexOf(ext)<0){set('Type not allowed','err');continue}
      if(f.size>MAX){set('Over 20 MB','err');continue}
      try{
        set('Uploading…','wait');
        await send(name,f,await toBase64(f));
        set('Submitted ✔','ok');
      }catch(e){set(e.message,'err')}
    }
  }
</script>
</body>
</html>
