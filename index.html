<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Output Drop-off</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mute:#64708a;--line:#dfe3ee;--brand:#2f5bea;--ok:#12805c;--err:#c0352b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1b2030;--ink:#eceff7;--mute:#9aa5bf;--line:#2c3348;--brand:#6b8cff;--ok:#4cc79a;--err:#ff7b70}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1b2030;--ink:#eceff7;--mute:#9aa5bf;--line:#2c3348;--brand:#6b8cff;--ok:#4cc79a;--err:#ff7b70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.drop{margin-top:14px;border:2px dashed var(--line);border-radius:14px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--mute)}
.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent);color:var(--ink)}
.drop strong{color:var(--brand)}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--brand);color:#fff}
button.ghost{background:transparent;color:var(--err);border:1px solid var(--line);padding:5px 10px;font-size:.85rem}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .m{color:var(--mute);font-size:.85rem}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--mute);flex:none}
a{color:var(--brand)}
.msg{margin-top:10px;font-size:.92rem}
.ok{color:var(--ok)}.err{color:var(--err)}
h2{font-size:1.05rem;margin:0 0 8px}
.who{font-weight:700;margin:14px 0 2px}
</style>
</head>
<body>
<main>
  <h1>📥 Output Drop-off</h1>
  <p class="sub">Upload your computer output here: PDF files or pictures (JPG, PNG, GIF, WEBP). Max 20 MB per file.</p>

  <div id="learner" class="card" hidden>
    <label for="nm">Your full name</label>
    <input id="nm" type="text" placeholder="e.g. Maria Santos" autocomplete="name">
    <div id="drop" class="drop" tabindex="0"><div><strong>Click to choose files</strong> or drag them here</div>
      <div style="font-size:.85rem;margin-top:4px">PDF · JPG · PNG · GIF · WEBP</div></div>
    <input id="pick" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,image/*,application/pdf" hidden>
    <div id="msg" class="msg" role="status"></div>
  </div>

  <div id="mine" class="card" hidden><h2>Your submitted files</h2><div id="mineList"></div></div>

  <div id="teacher" class="card" hidden><h2>All submissions (teacher view)</h2><div id="all"></div></div>

  <div id="off" class="card" hidden>Sign in to claude.ai to use the drop-off.</div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var assets=null,db=null,uid=null,isAdmin=false,myFiles=[],myName="";
  var TYPES={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp"};
  function say(t,c){var m=$("msg");m.textContent=t;m.className="msg "+(c||"")}
  function size(b){return b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
  function when(t){try{return new Date(t).toLocaleString()}catch(e){return ""}}
  function rowEl(f,del){
    var r=document.createElement("div");r.className="row";
    var th;
    if(f.type.indexOf("image/")===0){th=document.createElement("img");th.src="/_blob/"+f.id;th.alt=""}
    else{th=document.createElement("div");th.textContent="PDF"}
    th.className="thumb";r.appendChild(th);
    var t=document.createElement("div");t.className="t";
    var n=document.createElement("div");n.className="n";
    var a=document.createElement("a");a.href="/_blob/"+f.id;a.target="_blank";a.rel="noopener";a.textContent=f.name;n.appendChild(a);
    var m=document.createElement("div");m.className="m";m.textContent=size(f.size)+" · "+when(f.at);
    t.appendChild(n);t.appendChild(m);r.appendChild(t);
    if(del){var b=document.createElement("button");b.className="ghost";b.textContent="Delete";b.onclick=function(){del(f)};r.appendChild(b)}
    return r;
  }
  function renderMine(){
    $("mine").hidden=!myFiles.length;
    var L=$("mineList");L.textContent="";
    myFiles.slice().reverse().forEach(function(f){L.appendChild(rowEl(f,removeMine))});
  }
  async function saveMine(){
    await db.doc("submissions/"+uid).set({name:myName,files:myFiles,updated:Date.now()});
  }
  async function removeMine(f){
    if(!confirm("Delete "+f.name+"?"))return;
    try{
      myFiles=myFiles.filter(function(x){return x.id!==f.id});
      await saveMine();renderMine();
      try{await assets.delete(f.id)}catch(e){}
    }catch(e){say("Could not delete. Try again.","err")}
  }
  async function handle(list){
    var name=$("nm").value.trim();
    if(!name){say("Please type your name first.","err");$("nm").focus();return}
    myName=name;
    var ok=0,bad=[];
    for(var i=0;i<list.length;i++){
      var file=list[i],ext=(file.name.split(".").pop()||"").toLowerCase();
      if(/^(doc|docx|dotx)$/.test(ext)){bad.push(file.name+" (Word files aren’t accepted — in Word choose File ▸ Save as ▸ PDF, then upload the PDF)");continue}
      if(!TYPES[ext]){bad.push(file.name+" (type not allowed)");continue}
      if(file.size>20*1048576){bad.push(file.name+" (over 20 MB)");continue}
      say("Uploading "+file.name+"…");
      try{
        var res=await assets.upload(file.slice(0,file.size,TYPES[ext]));
        myFiles.push({id:res.id,name:file.name,type:TYPES[ext],size:res.sizeBytes||file.size,at:Date.now()});
        await saveMine();ok++;renderMine();
      }catch(e){bad.push(file.name+" ("+((e&&e.message)||"upload failed")+")")}
    }
    var s=ok?ok+" file"+(ok>1?"s":"")+" submitted ✔":"";
    if(bad.length)say((s?s+". ":"")+"Not uploaded: "+bad.join("; "),"err");else say(s,"ok");
  }
  function wire(){
    var d=$("drop"),p=$("pick");
    d.onclick=function(){p.click()};
    d.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();p.click()}};
    p.onchange=function(){handle(Array.from(p.files));p.value=""};
    d.ondragover=function(e){e.preventDefault();d.classList.add("over")};
    d.ondragleave=function(){d.classList.remove("over")};
    d.ondrop=function(e){e.preventDefault();d.classList.remove("over");handle(Array.from(e.dataTransfer.files))};
  }
  function renderAll(snap){
    var box=$("all");box.textContent="";
    if(snap.empty){box.textContent="No submissions yet.";return}
    snap.docs.forEach(function(s){
      var v=s.data()||{},fs=v.files||[];
      var h=document.createElement("div");h.className="who";h.textContent=(v.name||"Unnamed")+" ("+fs.length+")";box.appendChild(h);
      fs.forEach(function(f){box.appendChild(rowEl(f,null))});
    });
  }
  async function init(){
    wire();
    var user=null;
    try{user=await claude.use("user")}catch(e){}
    try{db=await claude.use("db")}catch(e){}
    try{assets=await claude.use("assets")}catch(e){}
    try{isAdmin=user?await user.canEdit():false}catch(e){}
    try{uid=user?await user.id():null}catch(e){}
    if(!db||!uid){$("off").hidden=false;return}
    if(assets){
      $("learner").hidden=false;
      try{
        var me=await db.doc("submissions/"+uid).get();
        var v=me.data&&me.data();
        if(v){myFiles=v.files||[];myName=v.name||"";$("nm").value=myName;renderMine()}
      }catch(e){}
    }else if(!isAdmin){$("off").hidden=false}
    if(isAdmin){
      $("teacher").hidden=false;
      var tm=setTimeout(function(){$("all").textContent="Could not load submissions."},10000);
      db.collection("submissions").onSnapshot(function(s){clearTimeout(tm);renderAll(s)},function(){clearTimeout(tm);$("all").textContent="Could not load submissions."});
    }
  }
  if(window.claude&&claude.use)init();else $("off").hidden=false;
})();
</script>
</body>
</html>
